apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-service-postgresql-egress
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.2.0/24
        - ipBlock:
            cidr: 10.20.3.0/24
      ports:
        - protocol: TCP
          port: 6432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-service-catalog-egress
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking-service
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-service
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-service-ingress
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking-service
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: staging
          podSelector:
            matchLabels:
              networking.restaurant-booking/access-booking-service: "true"
      ports:
        - protocol: TCP
          port: 8083
