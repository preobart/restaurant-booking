apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-service
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: api
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: booking-service
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: booking-service
          app.kubernetes.io/part-of: restaurant-booking
          app.kubernetes.io/component: api
          environment: staging
      data:
        BOOKING_DB_DSN: 'postgres://booking_staging:{{ .postgresqlPassword | urlquery }}@c-c9q3gaf98a21tn8dvb68.rw.mdb.yandexcloud.net:6432/booking_staging?sslmode=verify-full&sslrootcert=/etc/yandex-ca/ca.crt&target_session_attrs=read-write'
        JWT_SECRET: '{{ .jwtSecret }}'
  data:
    - secretKey: postgresqlPassword
      remoteRef:
        key: e6qfa6qd7k7567srils9
        property: postgresql_password
    - secretKey: jwtSecret
      remoteRef:
        key: e6q1defjt7a1d78bg8kd
        property: jwt_secret
