apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: api
    environment: staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: api
    environment: staging
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: http
