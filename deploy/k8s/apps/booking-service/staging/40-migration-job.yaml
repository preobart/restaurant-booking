apiVersion: batch/v1
kind: Job
metadata:
  name: booking-service-migrations
  namespace: staging
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: migration
    environment: staging
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-service
        app.kubernetes.io/part-of: restaurant-booking
        app.kubernetes.io/component: migration
        environment: staging
    spec:
      restartPolicy: Never
      serviceAccountName: booking-service
      automountServiceAccountToken: false
      nodeSelector:
        workload: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: cr.yandex/crpfrtdcq05e9r2l43ro/booking-service@sha256:f340d3d0d960ca030ec1496792a6658672b78200ecf58151f3bbc46e9f5a87b9
          imagePullPolicy: IfNotPresent
          command:
            - /app/migrate
            - -path
            - /app/migrations
            - -database
            - $(BOOKING_DB_DSN)
            - up
          env:
            - name: BOOKING_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: booking-service
                  key: BOOKING_DB_DSN
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: yandex-internal-root-ca
              mountPath: /etc/yandex-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: yandex-internal-root-ca
          configMap:
            name: yandex-internal-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
