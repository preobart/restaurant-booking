apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-service
  namespace: staging
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: api
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: catalog-service
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: catalog-service
          app.kubernetes.io/part-of: restaurant-booking
          app.kubernetes.io/component: api
          environment: staging
      data:
        CATALOG_DB_DSN: 'postgres://catalog_staging:{{ .postgresqlPassword | urlquery }}@c-c9q3gaf98a21tn8dvb68.rw.mdb.yandexcloud.net:6432/catalog_staging?sslmode=verify-full&sslrootcert=/etc/yandex-ca/ca.crt&target_session_attrs=read-write'
        JWT_SECRET: '{{ .jwtSecret }}'
        RABBITMQ_URL: 'amqp://{{ .rabbitmqUsername | urlquery }}:{{ .rabbitmqPassword | urlquery }}@lab-rabbitmq.platform.svc.cluster.local:5672/'
  data:
    - secretKey: postgresqlPassword
      remoteRef:
        key: e6qjjkr57d9v13o74qse
        property: postgresql_password
    - secretKey: jwtSecret
      remoteRef:
        key: e6q1defjt7a1d78bg8kd
        property: jwt_secret
    - secretKey: rabbitmqUsername
      remoteRef:
        key: e6qtimi50pl3hc33d1v4
        property: username
    - secretKey: rabbitmqPassword
      remoteRef:
        key: e6qtimi50pl3hc33d1v4
        property: password
