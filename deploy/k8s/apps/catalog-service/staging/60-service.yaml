apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: staging
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: api
    environment: staging
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: api
    environment: staging
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
      nodePort: 30082
