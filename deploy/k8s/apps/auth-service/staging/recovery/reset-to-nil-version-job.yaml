apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrations-reset-to-nil
  namespace: staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: migration-recovery
    environment: staging
  annotations:
    restaurant-booking/recovery-purpose: reset-first-failed-migration-to-nil-version
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: restaurant-booking
        app.kubernetes.io/component: migration-recovery
        environment: staging
    spec:
      restartPolicy: Never
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      nodeSelector:
        workload: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset-to-nil-version
          image: cr.yandex/crpfrtdcq05e9r2l43ro/auth-service@sha256:01025f039ba3897b6ff2b02bbdced4fc312f5ce4533f757367523c06b49cacbf
          imagePullPolicy: IfNotPresent
          command:
            - /app/migrate
            - -path
            - /app/migrations
            - -database
            - $(AUTH_DB_DSN)
            - force
            - --
            - "-1"
          env:
            - name: AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: auth-service
                  key: AUTH_DB_DSN
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: yandex-internal-root-ca
              mountPath: /etc/yandex-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: yandex-internal-root-ca
          configMap:
            name: yandex-internal-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
