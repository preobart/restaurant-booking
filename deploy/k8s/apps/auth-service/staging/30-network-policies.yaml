apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-postgresql-egress
  namespace: staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.2.0/24
        - ipBlock:
            cidr: 10.20.3.0/24
      ports:
        - protocol: TCP
          port: 6432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-rabbitmq-egress
  namespace: staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-rabbitmq
              app.kubernetes.io/component: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-ingress
  namespace: staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: restaurant-booking
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: staging
          podSelector:
            matchLabels:
              networking.restaurant-booking/access-auth-service: "true"
      ports:
        - protocol: TCP
          port: 8081
