apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: api
    environment: staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/component: api
      environment: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: restaurant-booking
        app.kubernetes.io/component: api
        environment: staging
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        workload: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
              app.kubernetes.io/component: api
              environment: staging
      containers:
        - name: auth-service
          image: cr.yandex/crpfrtdcq05e9r2l43ro/auth-service@sha256:01025f039ba3897b6ff2b02bbdced4fc312f5ce4533f757367523c06b49cacbf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auth-service
            - secretRef:
                name: auth-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: yandex-internal-root-ca
              mountPath: /etc/yandex-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: yandex-internal-root-ca
          configMap:
            name: yandex-internal-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
