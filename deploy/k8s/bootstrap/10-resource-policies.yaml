apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-resources
  namespace: platform
  labels:
    app.kubernetes.io/part-of: restaurant-booking
spec:
  hard:
    requests.cpu: "1500m"
    limits.cpu: "3"
    requests.memory: 3Gi
    limits.memory: 5Gi
    pods: "40"
    services: "20"
    configmaps: "50"
    secrets: "50"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-resources
  namespace: platform
  labels:
    app.kubernetes.io/part-of: restaurant-booking
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 20m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi
---
