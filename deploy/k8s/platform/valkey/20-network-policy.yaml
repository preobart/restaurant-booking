apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-egress
  namespace: production
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: cache
    environment: production
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.1.0/24
      ports:
        - protocol: TCP
          port: 6380
