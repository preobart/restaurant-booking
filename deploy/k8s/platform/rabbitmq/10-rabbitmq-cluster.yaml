apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: lab-rabbitmq
  namespace: platform
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: messaging
    environment: platform
spec:
  replicas: 3
  image: rabbitmq:4.3.1-management@sha256:8734b9e9cd03d12b2e1d973415fc4c5c941c5eca351b4bd63f721782b1bf7c8b
  secretBackend:
    externalSecret:
      name: lab-rabbitmq-default-user
  service:
    type: ClusterIP
  persistence:
    storageClassName: yc-network-ssd
    storage: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: lab-rabbitmq
              app.kubernetes.io/component: rabbitmq
          topologyKey: kubernetes.io/hostname
  rabbitmq:
    additionalConfig: |
      default_queue_type = quorum
      vm_memory_high_watermark.absolute = 512MiB
      disk_free_limit.absolute = 1GB
      collect_statistics_interval = 10000
