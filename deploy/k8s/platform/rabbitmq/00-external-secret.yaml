apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secret-store
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: secrets
spec:
  provider:
    yandexlockbox:
      auth:
        authorizedKeySecretRef:
          name: sa-creds
          namespace: external-secrets
          key: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-rabbitmq-default-user
  namespace: platform
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: messaging
    environment: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: lab-rabbitmq-default-user
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: restaurant-booking
          app.kubernetes.io/component: messaging
          environment: platform
      data:
        default_user.conf: |
          default_user = {{ .username }}
          default_pass = {{ .password }}
        host: lab-rabbitmq.platform.svc.cluster.local
        username: "{{ .username }}"
        password: "{{ .password }}"
        port: "5672"
        provider: rabbitmq
        type: rabbitmq
  data:
    - secretKey: username
      remoteRef:
        key: e6qtimi50pl3hc33d1v4
        property: username
    - secretKey: password
      remoteRef:
        key: e6qtimi50pl3hc33d1v4
        property: password
