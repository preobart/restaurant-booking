# Optional: apply only after the staging services expose HTTP 200 on /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: restaurant-booking-staging
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restaurant-booking
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: monitoring
    environment: staging
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchLabels:
      app.kubernetes.io/part-of: restaurant-booking
      app.kubernetes.io/component: api
      environment: staging
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
