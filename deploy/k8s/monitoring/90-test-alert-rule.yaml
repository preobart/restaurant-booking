# Optional: apply temporarily to verify the Prometheus and Alertmanager pipeline.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restaurant-booking-monitoring-test
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restaurant-booking
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: alerting-test
    environment: staging
    release: prometheus
spec:
  groups:
    - name: restaurant-booking.monitoring.test
      interval: 30s
      rules:
        - alert: MonitoringPipelineTest
          expr: vector(1)
          for: 1m
          labels:
            severity: warning
            environment: staging
          annotations:
            summary: "Тестовый alert мониторинга"
            description: "Временное правило подтверждает, что PrometheusRule загружен и вычисляется. После проверки удалите этот объект."
