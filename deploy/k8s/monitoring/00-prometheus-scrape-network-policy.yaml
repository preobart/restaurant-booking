apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: staging
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: monitoring
    environment: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: restaurant-booking
      app.kubernetes.io/component: api
      environment: staging
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
