apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-booking-staging
  namespace: staging
  labels:
    app.kubernetes.io/name: restaurant-booking
    app.kubernetes.io/part-of: restaurant-booking
    app.kubernetes.io/component: ingress
    environment: staging
  annotations:
    gwin.yandex.cloud/groupName: restaurant-booking-staging
    gwin.yandex.cloud/externalIPv4Address: auto
    gwin.yandex.cloud/securityGroups: enpdntuqp8q5v422beh1
spec:
  ingressClassName: gwin-default
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /api/restaurants
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8082
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8083
