global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by:
    - alertname
    - namespace
    - deployment
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: lab-email
      matchers:
        - severity="warning"

receivers:
  - name: "null"
    yandex_monitoring_configs:
      - channel_names: []
  - name: lab-email
    yandex_monitoring_configs:
      - channel_names:
          - lab-alerts-email
