groups:
  - name: restaurant-booking.monitoring.test
    interval: 30s
    rules:
      - alert: MonitoringPipelineTest
        expr: vector(1)
        for: 1m
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: "Тестовый alert мониторинга"
          description: "Временное правило проверяет Managed Prometheus, Managed Alertmanager и почтовый канал. После проверки удалите файл правил из workspace."
