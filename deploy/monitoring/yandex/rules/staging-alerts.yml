groups:
  - name: restaurant-booking.staging.availability
    interval: 30s
    rules:
      - alert: StagingDeploymentReplicasUnavailable
        expr: |
          (
            max by (namespace, deployment) (
              kube_deployment_spec_replicas{namespace="staging"}
            )
            -
            max by (namespace, deployment) (
              kube_deployment_status_replicas_available{namespace="staging"}
            )
          ) > 0
        for: 2m
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: "Deployment {{ $labels.deployment }} потерял доступную реплику"
          description: "В namespace staging у Deployment {{ $labels.deployment }} меньше доступных реплик, чем запрошено, более двух минут."
